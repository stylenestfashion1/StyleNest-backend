
spring.application.name=stylenest_backend

server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Defaults keep every existing deployment (Render, GCP, local dev against
# Neon) working unchanged. Local dev and production on the Hostinger VPS
# switch both to MySQL purely via env vars -- no separate profile/properties
# file needed, no code change required to move between databases:
#   SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
#   SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
# (plus the matching SPRING_DATASOURCE_URL/USERNAME/PASSWORD, e.g.
# jdbc:mysql://localhost:3306/StyleNest_Db)
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.jackson.time-zone=Asia/Kolkata

app.jwt.secret=${JWT_SECRET}
# Admin session duration -- unchanged, kept separate from customers below.
app.jwt.expiration=${JWT_EXPIRATION}
# Customer session duration -- 7 days by default (604800000 ms), so
# customers aren't forced to log in again roughly daily.
app.jwt.customer-expiration=${JWT_CUSTOMER_EXPIRATION:604800000}

# Comma-separated list of allowed CORS origins. Default keeps local dev
# working; add the real production frontend domain here via env var once
# it's finalized -- no code change needed (see SecurityConfig).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Ensure unmatched routes raise NoHandlerFoundException (caught by
# GlobalExceptionHandler and turned into a clean 404) instead of being
# silently absorbed by the static resource handler.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false



# Mail Configuration -- SMTP via Brevo's SMTP relay (smtp-relay.brevo.com:587,
# STARTTLS). MAIL_USERNAME/MAIL_PASSWORD are the SMTP login and SMTP key from
# the Brevo account, not the account's own login email/password. MAIL_FROM
# must be a sender address verified in that Brevo account, or sends will be
# rejected regardless of correct auth.
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM}
app.mail.from-name=${MAIL_FROM_NAME:StyleNest Fashion}

# Easebuzz Payment Gateway (test/sandbox by default; set EASEBUZZ_ENV=prod to go live)
easebuzz.key=${EASEBUZZ_KEY:}
easebuzz.salt=${EASEBUZZ_SALT:}
easebuzz.env=${EASEBUZZ_ENV:test}

# Used to build the absolute surl/furl Easebuzz redirects back to, and the
# frontend URL the customer is sent to once we've verified the payment result.
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Local-filesystem product image storage. Root directory only -- the
# service appends a fixed "/products" subfolder. Local dev defaults to a
# project-relative folder; on the VPS, set APP_UPLOAD_DIR to an absolute
# path outside the deployed jar's directory (e.g. /opt/stylenest/uploads)
# so uploads survive a redeploy. Public URLs are built from app.base-url
# above, so they're already environment-correct with no separate config.
app.upload.dir=${APP_UPLOAD_DIR:./uploads}

# Multipart upload limits (image uploads only -- no other endpoint accepts
# file uploads). 5MB is generous for a product photo while keeping the
# VPS's disk/memory usage bounded.
spring.servlet.multipart.max-file-size=${APP_UPLOAD_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${APP_UPLOAD_MAX_REQUEST_SIZE:5MB}

# Country-aware postal/ZIP code lookup (city/region auto-suggest). Free,
# keyless, no credentials required. Must never block checkout -- short
# timeout, PostalLookupService always fails open on any error. Zippopotam
# handles US/AU/CA/everyone else; India and the UK are routed to dedicated
# sources because Zippopotam has no usable city-level data for either --
# see CompositePostalLookupServiceImpl for why.
postal-lookup.base-url=${POSTAL_LOOKUP_BASE_URL:https://api.zippopotam.us}
postal-lookup.india-base-url=${POSTAL_LOOKUP_INDIA_BASE_URL:https://api.postalpincode.in}
postal-lookup.uk-base-url=${POSTAL_LOOKUP_UK_BASE_URL:https://api.postcodes.io}
postal-lookup.timeout-ms=${POSTAL_LOOKUP_TIMEOUT_MS:3000}
