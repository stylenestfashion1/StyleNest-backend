
spring.application.name=stylenest_backend

server.port=${PORT:8080}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Defaults keep every existing deployment (Render, GCP, local dev against
# Neon) working unchanged. Local dev and production on the Hostinger VPS
# switch both to MySQL purely via env vars -- no separate profile/properties
# file needed, no code change required to move between databases:
#   SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
#   SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
# (plus the matching SPRING_DATASOURCE_URL/USERNAME/PASSWORD, e.g.
# jdbc:mysql://localhost:3306/StyleNest_Db)
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.jackson.time-zone=Asia/Kolkata

app.jwt.secret=${JWT_SECRET}
# Admin session duration -- unchanged, kept separate from customers below.
app.jwt.expiration=${JWT_EXPIRATION}
# Customer session duration -- 7 days by default (604800000 ms), so
# customers aren't forced to log in again roughly daily.
app.jwt.customer-expiration=${JWT_CUSTOMER_EXPIRATION:604800000}

# Comma-separated list of allowed CORS origins. Default keeps local dev
# working; add the real production frontend domain here via env var once
# it's finalized -- no code change needed (see SecurityConfig).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Ensure unmatched routes raise NoHandlerFoundException (caught by
# GlobalExceptionHandler and turned into a clean 404) instead of being
# silently absorbed by the static resource handler.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false



# Mail Configuration -- SMTP via Brevo's SMTP relay (smtp-relay.brevo.com:587,
# STARTTLS). MAIL_USERNAME/MAIL_PASSWORD are the SMTP login and SMTP key from
# the Brevo account, not the account's own login email/password. MAIL_FROM
# must be a sender address verified in that Brevo account, or sends will be
# rejected regardless of correct auth.
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM}
app.mail.from-name=${MAIL_FROM_NAME:StyleNest Fashion}

# Seller/business data for GST invoices -- the business's own verified
# details (from the supplied legal policy documents and reference invoice),
# overridable per-environment via env vars. Never fabricated.
app.invoice.seller.name=${INVOICE_SELLER_NAME:Style Nest Fashion}
app.invoice.seller.address-line=${INVOICE_SELLER_ADDRESS:175-B, Amrit Palace, Nipania, Indore, Madhya Pradesh - 452010}
app.invoice.seller.phone=${INVOICE_SELLER_PHONE:6269933231}
app.invoice.seller.email=${INVOICE_SELLER_EMAIL:stylenestfashion1@gmail.com}
app.invoice.seller.state=${INVOICE_SELLER_STATE:Madhya Pradesh}
app.invoice.seller.state-code=${INVOICE_SELLER_STATE_CODE:23}
app.invoice.seller.gstin=${INVOICE_SELLER_GSTIN:23ABUCS8160R1ZA}
app.invoice.seller.cin=${INVOICE_SELLER_CIN:U14101MP2026PTC086429}

# Centralized GST/tax rule (see GstRuleProperties / GstCalculationService)
# -- the ONLY place to change if the GST Council revises the applicable
# apparel threshold or rates. Every new order/invoice (retail and bulk)
# picks up a change here automatically; already-finalized invoices keep
# whatever rate was actually applied at generation time and are never
# affected. Not a secret, so a plain literal here (not env-var-backed) is
# fine -- update and redeploy when the business confirms a new rate.
app.gst.apparel-threshold=2500.00
app.gst.rate-at-or-below-threshold=5
app.gst.rate-above-threshold=18

# In-store QR discount/rewards system -- the ONE permanent, long random,
# unguessable secret printed into the shop's QR code
# (https://.../special-offer/<this-token>). No default on purpose, same as
# app.jwt.secret above: a real value must be set via env var in every
# environment that needs this feature to work, rather than shipping a
# guessable placeholder. Rotating this value invalidates the existing
# printed QR poster -- reprint it via Admin -> Rewards -> Show Discount QR
# after changing it.
app.discount.qr-secret-token=${DISCOUNT_QR_SECRET_TOKEN}

# Cashfree Payment Gateway. client-id is not secret (sent as a request
# header to Cashfree, never returned to our own frontend -- Cashfree's
# checkout flow needs no key of any kind client-side, only the
# payment_session_id PaymentInitiateResponse already returns); client-secret
# must never leave the backend, and also doubles as the webhook HMAC key
# (Cashfree uses one secret for both, unlike a previous gateway's separate
# webhook secret). Configure the webhook URL itself
# (https://<host>/api/payments/webhook) in the Cashfree Dashboard, not
# here. mode selects both the API base URL (production vs sandbox) and is
# also what the frontend's Cashfree JS SDK must be initialized with.
# international-payments-enabled defaults to false until the merchant's
# Cashfree account is actually confirmed activated for international
# payments -- see OrderServiceImpl.
cashfree.client-id=${CASHFREE_APP_ID:}
cashfree.client-secret=${CASHFREE_SECRET_KEY:}
cashfree.api-version=${CASHFREE_API_VERSION:2025-01-01}
cashfree.mode=${CASHFREE_MODE:production}
payment.international-payments-enabled=${INTERNATIONAL_PAYMENTS_ENABLED:false}

# DTDC Courier Integration (see DtdcShippingProviderClient). Two separate
# auth mechanisms per DTDC's own docs: api-key is a static header credential
# (no token exchange) used for Order Upload/Booking, Shipping Label and
# Cancellation, all on pxapi.dtdc.in; tracking uses a SEPARATE
# username/password -> token exchange against blktracksvc.dtdc.com (DTDC's
# REST Tracking API v4 -- a different subsystem with its own auth). None of
# these have a real value here or anywhere else in this codebase -- DTDC
# issues them when the business's account is set up; booking/tracking fails
# fast with a clear error until they're set. customer-code/service-type-id/
# commodity-id are DTDC account configuration, not secrets, but still
# env-var-overridable rather than hardcoded so they can change without a
# redeploy. mode=staging switches every DTDC base URL to DTDC's staging
# environment in one place.
dtdc.mode=${DTDC_MODE:production}
dtdc.api-key=${DTDC_API_KEY:}
dtdc.customer-code=${DTDC_CUSTOMER_CODE:}
dtdc.service-type-id=${DTDC_SERVICE_TYPE_ID:B2C PRIORITY}
dtdc.commodity-id=${DTDC_COMMODITY_ID:Apparel}
dtdc.tracking-username=${DTDC_TRACKING_USERNAME:}
dtdc.tracking-password=${DTDC_TRACKING_PASSWORD:}

# DTDC shipment origin (StyleNest's own dispatch address) -- split into the
# discrete address-line/city/pincode fields DTDC's Order Upload API
# requires, which app.invoice.seller.address-line above doesn't have
# separately. Same already-verified business address; name/phone/state are
# reused directly from app.invoice.seller.* above rather than duplicated.
dtdc.origin.address-line1=${DTDC_ORIGIN_ADDRESS_LINE1:175-B, Amrit Palace, Nipania}
dtdc.origin.city=${DTDC_ORIGIN_CITY:Indore}
dtdc.origin.pincode=${DTDC_ORIGIN_PINCODE:452010}

# Used to build absolute public image URLs (app.base-url), the discount
# QR page link (app.frontend-url), and the Cashfree order return_url/
# notify_url (see CashfreePaymentProviderClient) -- Cashfree Checkout is
# opened as a client-side modal, not a server-side redirect flow, so
# return_url is only ever a fallback.
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Local-filesystem product image storage. Root directory only -- the
# service appends a fixed "/products" subfolder. Local dev defaults to a
# project-relative folder; on the VPS, set APP_UPLOAD_DIR to an absolute
# path outside the deployed jar's directory (e.g. /opt/stylenest/uploads)
# so uploads survive a redeploy. Public URLs are built from app.base-url
# above, so they're already environment-correct with no separate config.
app.upload.dir=${APP_UPLOAD_DIR:./uploads}

# Multipart upload limits (image uploads only -- no other endpoint accepts
# file uploads). 5MB is generous for a product photo while keeping the
# VPS's disk/memory usage bounded.
spring.servlet.multipart.max-file-size=${APP_UPLOAD_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${APP_UPLOAD_MAX_REQUEST_SIZE:5MB}

# Country-aware postal/ZIP code lookup (city/region auto-suggest). Free,
# keyless, no credentials required. Must never block checkout -- short
# timeout, PostalLookupService always fails open on any error. Zippopotam
# handles US/AU/CA/everyone else; India and the UK are routed to dedicated
# sources because Zippopotam has no usable city-level data for either --
# see CompositePostalLookupServiceImpl for why.
postal-lookup.base-url=${POSTAL_LOOKUP_BASE_URL:https://api.zippopotam.us}
postal-lookup.india-base-url=${POSTAL_LOOKUP_INDIA_BASE_URL:https://api.postalpincode.in}
postal-lookup.uk-base-url=${POSTAL_LOOKUP_UK_BASE_URL:https://api.postcodes.io}
postal-lookup.timeout-ms=${POSTAL_LOOKUP_TIMEOUT_MS:3000}
