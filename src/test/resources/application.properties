spring.application.name=stylenest_backend

spring.datasource.url=jdbc:h2:mem:stylenest_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jackson.time-zone=Asia/Kolkata

app.jwt.secret=test-only-jwt-signing-secret-not-used-in-production-0123456789
app.jwt.expiration=3600000
app.jwt.customer-expiration=604800000

app.discount.qr-secret-token=test-only-discount-qr-token-not-used-in-production-0123456789

cors.allowed-origins=http://localhost:5173

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test
app.mail.from=test@stylenest.example
app.mail.from-name=StyleNest Test

easebuzz.key=test-merchant-key
easebuzz.salt=test-salt
easebuzz.env=test

app.base-url=http://localhost:8080
app.frontend-url=http://localhost:5173
app.upload.dir=./target/test-uploads

postal-lookup.base-url=https://api.zippopotam.us
postal-lookup.india-base-url=https://api.postalpincode.in
postal-lookup.uk-base-url=https://api.postcodes.io
postal-lookup.timeout-ms=3000